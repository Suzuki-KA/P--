<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Security Quiz</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <!-- 問題選択画面 -->
    <div id="top-screen" class="screenstart">
        <div class="center-group">
            <h1>セキュリティクイズ</h1>
            <button class="start-botton" onclick="showMenuScreen()">
                スタート
            </button>
        </div>
    </div>

    <!-- 問題選択画面 -->
    <div id="menu-screen" class="screenvideo hidden">
        <h1>セキュリティクイズ一覧</h1>
        <div class="quiz-list">
            <button class="option-card" onclick="studyQuiz(1)">
                <span>SNS</span>
                <img src="../static/quiz1.png" width="200">
            </button>
            <button class="option-card" onclick="studyQuiz(2)">
                <span>フィッシングメール</span>
                <img src="../static/quiz2.png" width="200">
            </button>
            <button class="option-card" onclick="studyQuiz(3)">
                <span>パスワード</span>
                <img src="../static/quiz3.png" width="200">
            </button>
        </div>
    </div>

    <!-- 動画視聴画面 -->
    <div id="study-screen" class="screenvideo hidden">
        <header>
            <div class="progress-container">
                <div class="progress-bar" style="width: 33%;"></div>
            </div>
            <div class="step-number">Step 1 / 3</div>
        </header>

        <h1>動画視聴</h1>
        <iframe id="video-frame" width="800" height="450" src="" title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>
        <button onclick="showQuizScreen()">
            問題へ
        </button>

    </div>

    <!-- クイズ画面 -->
    <div id="image-screen" class="screen hidden">
        <h1>シナリオ</h1>
        <img id="image-url" src="">
    </div>

    <div id="quiz-screen" class="screen hidden">
        <header>
            <div class="progress-container">
                <div class="progress-bar" style="width: 66%;"></div>
            </div>
            <div class="step-number">Step 2 / 3</div>
        </header>

        <h1>問題</h1>
        <h2 id="question-text"></h2>
        <div class="options-grid">
            <button class="botton-card" onclick="answerQuestion(1)">
                <span class="option-label">1</span>
                <p id="select1"></p>
            </button>
            <button class="botton-card" onclick="answerQuestion(2)">
                <span class="option-label">2</span>
                <p id="select2"></p>
            </button>
            <button class="botton-card" onclick="answerQuestion(3)">
                <span class="option-label">3</span>
                <p id="select3"></p>
            </button>
            <button class="botton-card" onclick="answerQuestion(4)">
                <span class="option-label">4</span>
                <p id="select4"></p>
            </button>

        </div>


    </div>

    <!-- 解説画面 -->
    <div id="explanation-screen" class="screen hidden">
        <header>
            <div class="progress-container">
                <div class="progress-bar" style="width: 100%;"></div>
            </div>
            <div class="step-number">Step 3 / 3</div>
        </header>

        <h1>解説</h1>

        <p id="explanation-text"></p>

        <button onclick="showTopScreen()">
            トップ画面へ
        </button>

    </div>

    <script src="../static/script.js"></script>

</body>

</html>
