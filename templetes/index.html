<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Security Quiz</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
<!-- 問題選択画面 -->
    <div id="menu-screen" class="screen">

        <h1>セキュリティクイズ一覧</h1>
        <button onclick="studyQuiz(1)">
            クイズ1
        </button>
        <button class="option-card" onclick="studyQuiz(2)">
            クイズ2
        </button>
        <button class="option-card" onclick="studyQuiz(3)">
            クイズ3
        </button>

    </div>

    <!-- 動画視聴画面 -->
    <div id="study-screen" class="screenvideo hidden">
        
        <h1>動画視聴</h1>
        <iframe id="video-frame" width="800" height="450" src=""
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>
        <button onclick="showQuizScreen()">
            問題へ
        </button>

    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen hidden">

        <h1 >問題</h1>
        <h2 id="question-text"></h2>
        
            <button class="option-button" onclick="answerQuestion(true)">
                <p id="select1"></p>
            </button>

            <button class="option-button" onclick="answerQuestion(false)">
                <p id="select2"></p>
            </button>

            <button class="option-button" onclick="answerQuestion(false)">
                <p id="select3"></p>
            </button>

            <button class="option-button" onclick="answerQuestion(false)">
                <p id="select4"></p>
            </button>

    </div>

    <!-- 解説画面 -->
    <div id="explanation-screen" class="screen hidden">

        <h1>解説</h1>

        <p>
            解説解説解説。
        </p>

        <button onclick="showMenuScreen()">
            問題選択へ
        </button>

    </div>

    <script src="../static/script.js"></script>

</body>

</html>
